  <script>     
    window.$docsify = {
      name: '<img src="https://kiosk007.top/docsify-book/special_subject/_media/shiba.svg"><p>专题</p>',
      repo: '',
      loadSidebar: true,    // 加载 _sidebar.md
      loadNavbar: false,     // 加载 _navbar.md
      subMaxLevel: 2,
      themeColor: '#3F51B5',
      sidebarDisplayLevel: 2,
      coverpage: false,
      onlyCover: false,
      auto2top: true,
      mergeNavbar: true,
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      externalLinkTarget: '_blank',
      alias: {
        "/.*/_sidebar.md": "/_sidebar.md",
      },
      
      footer: {
        copy: '<span> CC BY-NC 4.0 | 京ICP备20015006号-1 &copy; </span>',
        auth: 'kiosk007',
        pre: '<hr/>',
        style: 'text-align: right;',
        class: 'className',
      },

      // 字数统计
      count: {
          countable: true,
          position: "top",
          margin: "30px",
          float: "right",
          fontsize: "0.9em",
          language: "chinese",
          localization: {
            words: "",
            minute: "",
          },
          isExpected: true,
      },

      // 面包屑
      breadcrumb: {
        showHome: true,
        homeText: 'Home',
        separator: ' &rsaquo; ',
        casing: 'capitalize',
        linkColor: 'var(--theme-color, #42b983)',
        size: 'small'
      },

      // 底部导航
      pagination: {
        previousText: "上一页",
        nextText: "下一页",
        crossChapter: true,
        crossChapterText: true,
      },

      // 代码折叠
      hideCode: {
        scroll: false, // Enable scrolling
        height: 800 // Max height
      },   
      
      // TOC
      toc: {
        tocMaxLevel: 3,
        target: 'h2, h3',
        ignoreHeaders:  ['<!-- {docsify-ignore} -->', '<!-- {docsify-ignore-all} -->']
      },

      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'drawio') {
              if (window.drawioConverter) {
                console.log('drawio 转化中')
                return window.drawioConverter(code)
              } else {
                return `<div class='drawio-code'>${code}</div>`
              }
            } else {
              return this.origin.code.apply(this, arguments);
            }
          }
        }
      },

      plugins: [
        function (hook, vm) {
          /*termynal.js*/
          hook.beforeEach(function(content){
              return content;  // 直接返回内容，不使用 beforeEach 函数
          })
          hook.doneEach(function (){
              if (typeof setupTermynal === 'function') {
                  setupTermynal();
              }
              if (typeof showRandomAnnouncement === 'function') {
                  showRandomAnnouncement('announce-left', 5000);
                  showRandomAnnouncement('announce-right', 10000);
              }
          });
        }
      ]
    };
  
 </script>
