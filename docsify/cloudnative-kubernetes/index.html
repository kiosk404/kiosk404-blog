<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiosk's Studio</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"> -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fontawesome-free-6.2.1@6.2.1/css/all.min.css">
  <!-- 添加 highlight.js 的样式 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/vs2015.min.css">
  <!-- Themes (light + dark) -->
  <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
 
  <style>
    /* 全局变量配置 */
    :root {
      --code-bg: #1e1e1e;
      --code-text: #d4d4d4;
      --code-font: 'JetBrains Mono', Consolas, 'Courier New', monospace;
      --code-font-size: 14px;
      --code-line-height: 1.5;
      --code-padding: 1em;
      --code-border-radius: 6px;
      --code-max-height: 400px;
      --scrollbar-thumb: #4d4d4d;
      --scrollbar-track: #1e1e1e;
      --button-bg: #2d2d2d;
      --button-hover-bg: #3d3d3d;
    }

    /* 代码块基础样式 */
    .markdown-section pre {
      background-color: var(--code-bg) !important;
      border-radius: var(--code-border-radius) !important;
      padding: var(--code-padding) !important;
      position: relative;
      margin: 1em 0;
    }

    .markdown-section pre > code {
      font-family: var(--code-font);
      font-size: var(--code-font-size);
      line-height: var(--code-line-height);
      padding: var(--code-padding) 0;
    }

    /* VSCode 风格的代码高亮 */
    .hljs {
      background: var(--code-bg) !important;
      color: var(--code-text) !important;
    }
    .hljs-keyword { color: #569cd6 !important; }
    .hljs-built_in { color: #4ec9b0 !important; }
    .hljs-type { color: #4ec9b0 !important; }
    .hljs-literal { color: #569cd6 !important; }
    .hljs-number { color: #b5cea8 !important; }
    .hljs-string { color: #ce9178 !important; }
    .hljs-comment { color: #6a9955 !important; }
    .hljs-function { color: #dcdcaa !important; }

    /* 代码复制按钮 */
    .docsify-copy-code-button {
      background: var(--button-bg) !important;
      border-radius: calc(var(--code-border-radius) / 2) !important;
      font-size: 0.8em !important;
      padding: 8px 16px !important;
      right: 8px !important;
      top: 8px !important;
    }

    .docsify-copy-code-button:hover {
      background: var(--button-hover-bg) !important;
    }

    /* 滚动条样式 */
    .markdown-section pre::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .markdown-section pre::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: calc(var(--code-border-radius) / 2);
    }

    .markdown-section pre::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
    }

    /* 代码折叠相关样式 */
    .markdown-section pre.long-code {
      max-height: var(--code-max-height);
      overflow: hidden;
    }

    .markdown-section pre.long-code.expanded {
      max-height: none;
    }

    .code-expand-btn {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(transparent, var(--code-bg) 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .code-expand-btn:hover {
      background: linear-gradient(transparent, var(--button-hover-bg) 50%);
    }

    .code-expand-btn span {
      background: var(--button-bg);
      padding: 4px 12px;
      border-radius: calc(var(--code-border-radius) / 2);
      font-size: 12px;
      color: var(--code-text);
      font-family: var(--code-font);
    }

    .code-expand-btn:hover span {
      background: var(--button-hover-bg);
    }

    pre.expanded .code-expand-btn {
      background: var(--code-bg);
    }
  </style>

</head>
<body>
  <nav>
    <a target="_self" href="https://kiosk007.top"><i class="fas fa-home"></i> Kiosk's Blog</a>
  </nav>
  <div id="app">Loading ...</div>
  <script>
    // 代码配置选项
    const codeConfig = {
      maxLines: 50,           // 超过多少行折叠
      maxHeight: '400px',     // 折叠时的最大高度
      expandText: '展开代码', // 展开按钮文字
      collapseText: '收起代码', // 收起按钮文字
      showLineCount: true,    // 是否显示行数
    };        
    window.$docsify = {
      name: '<img src="https://kiosk007.top/docsify-book/cloudnative-kubernetes/_media/k8s.svg"><p>深入 kubertnets</p>',
      repo: '',
      loadSidebar: true,    // 加载 _sidebar.md
      loadNavbar: false,     // 加载 _navbar.md
      hideSidebar: false,
      subMaxLevel: 3,
      themeColor: '#3F51B5',
      sidebarDisplayLevel: 1,
      coverpage: false,
      onlyCover: false,
      auto2top: true,
      mergeNavbar: true,
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      externalLinkTarget: '_blank',
      
      // 代码复制配置
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      
      // 代码高亮配置
      markdown: {
        smartypants: true,
        renderer: {
          code: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) {
              try {
                const highlighted = hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
                const lines = code.split('\n').length;
                const longCodeClass = lines > codeConfig.maxLines ? 'long-code' : '';
                
                let html = `<pre data-lang="${lang}" class="${longCodeClass}"><code class="hljs language-${lang}">${highlighted}</code>`;
                
                if (lines > codeConfig.maxLines) {
                  const lineText = codeConfig.showLineCount ? ` (${lines} 行)` : '';
                  html += `
                    <div class="code-expand-btn">
                      <span class="expand-text">${codeConfig.expandText}${lineText}</span>
                    </div>
                  `;
                }
                
                html += '</pre>';
                return html;
              } catch (__) {}
            }
            return `<pre data-lang="text"><code class="hljs">${code}</code></pre>`;
          }
        }
      }
    };
    
    // 代码折叠功能
    document.addEventListener('click', function(e) {
      const target = e.target;
      if (target.classList.contains('code-expand-btn') || target.parentElement.classList.contains('code-expand-btn')) {
        const btn = target.classList.contains('code-expand-btn') ? target : target.parentElement;
        const pre = btn.parentElement;
        const expandText = btn.querySelector('.expand-text');
        const lines = pre.querySelector('code').innerText.split('\n').length;
        const lineText = codeConfig.showLineCount ? ` (${lines} 行)` : '';
        
        if (pre.classList.contains('expanded')) {
          pre.classList.remove('expanded');
          expandText.textContent = `${codeConfig.expandText}${lineText}`;
          pre.scrollIntoView({ behavior: 'smooth' });
        } else {
          pre.classList.add('expanded');
          expandText.textContent = `${codeConfig.collapseText}${lineText}`;
        }
      }
    });
 
  
 </script>
  <!-- 先加载 highlight.js -->
  <script src="//cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

</body>
