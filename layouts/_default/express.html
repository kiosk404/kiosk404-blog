<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - {{ .Site.Title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #333333;
            --accent: #007acc;
            --muted: #666666;
            --border: #e1e4e8;
            --hover: #f6f8fa;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.3;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 导航菜单样式 */
        .nav-menu {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
            padding: 15px 0;
        }

        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-brand {
            color: var(--accent);
            font-weight: 500;
            font-size: 16px;
            text-decoration: none;
        }

        .nav-brand:hover {
            color: var(--text);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-link:hover {
            color: var(--accent);
        }

        .nav-link::before {
            content: '$ ';
            color: var(--accent);
            margin-right: 4px;
        }

        .nav-link.active {
            color: var(--accent);
            font-weight: 500;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
        }
        
        .header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }
        
        .prompt {
            color: var(--accent);
            margin-bottom: 8px;
        }
        
        .path {
            color: var(--muted);
            font-size: 12px;
        }
        
        .search {
            margin-bottom: 25px;
        }
        
        .search-input {
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: inherit;
            width: 100%;
            outline: none;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .search-input:focus {
            border-bottom-color: var(--accent);
        }
        
        .search-input::placeholder {
            color: var(--muted);
        }
        
        .stats {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            font-size: 12px;
            color: var(--muted);
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .stat-number {
            color: var(--accent);
            font-weight: 500;
        }
        
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        
        .filter-tag {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 3px 10px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        .filter-tag:hover,
        .filter-tag.active {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .category {
            margin-bottom: 30px;
        }
        
        .category-title {
            color: var(--accent);
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        
        .link {
            padding: 6px 0;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
        }
        
        .link:hover {
            background: var(--hover);
            padding-left: 6px;
        }
        
        .link::before {
            content: '$ ';
            color: var(--accent);
            margin-right: 6px;
        }
        
        .link-title {
            font-weight: 500;
            margin-bottom: 1px;
        }
        
        .link-desc {
            color: var(--muted);
            font-size: 12px;
            margin-left: 18px;
            margin-bottom: 1px;
        }
        
        .link-url {
            color: var(--muted);
            font-size: 11px;
            margin-left: 18px;
            word-break: break-all;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 15px;
                font-size: 13px;
            }
            
            .nav-container {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .nav-links {
                gap: 15px;
            }
            
            .stats {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

            <input type="text"

        <!-- Stats -->

            <div class="stat">

        </div>

        <!-- Filters -->
        <div class="filters" id="filter-tags">
            <span class="filter-tag active" data-category="all">all</span>

        let currentFilter = 'all';
        let searchQuery = '';

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateStats();
            renderFilterTags();
            renderLinks();
            setupEventListeners();
        });

        function updateStats() {
            const totalLinks = linksData.length;
            const categories = [...new Set(linksData.map(link => link.category))];
            const filteredLinks = getFilteredLinks().length;

            document.getElementById('total-links').textContent = totalLinks;
            document.getElementById('total-categories').textContent = categories.length;
            document.getElementById('filtered-links').textContent = filteredLinks;
        }

        function renderFilterTags() {
            const categories = ['all', ...new Set(linksData.map(link => link.category))];
            const filterTagsContainer = document.getElementById('filter-tags');
            
            filterTagsContainer.innerHTML = categories.map(category => 
                `<span class="filter-tag ${category === 'all' ? 'active' : ''}" data-category="${category}">${category}</span>`
            ).join('');
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            const filteredLinks = getFilteredLinks();
            
            if (filteredLinks.length === 0) {
                container.innerHTML = `
                    <div class="category">
                        <div class="category-title">$ No results found</div>
                        <div class="link">
                            <div class="link-title">No links match your search criteria</div>
                        </div>
                    </div>
                `;
                return;
            }

            const linksByCategory = groupLinksByCategory(filteredLinks);
            
            container.innerHTML = Object.entries(linksByCategory).map(([category, links]) => `
                <div class="category">
                    <div class="category-title">$ ${category}</div>
                    ${links.map(link => `
                        <div class="link" onclick="openLink('${link.url}')">
                            <div class="link-title">${link.title}</div>
                            <div class="link-desc">${link.description}</div>
                            <div class="link-url">${link.url}</div>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function groupLinksByCategory(links) {
            return links.reduce((acc, link) => {
                if (!acc[link.category]) {
                    acc[link.category] = [];
                }
                acc[link.category].push(link);
                return acc;
            }, {});
        }

        function getFilteredLinks() {
            return linksData.filter(link => {
                const matchesCategory = currentFilter === 'all' || link.category === currentFilter;
                const matchesSearch = searchQuery === '' || 
                    link.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    link.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    link.url.toLowerCase().includes(searchQuery.toLowerCase());
                
                return matchesCategory && matchesSearch;
            });
        }

        function setupEventListeners() {
            // Filter tag clicks
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('filter-tag')) {
                    const category = e.target.dataset.category;
                    setActiveFilter(category);
                }
            });

            // Search input
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', function(e) {
                searchQuery = e.target.value;
                renderLinks();
                updateStats();
            });
        }

        function setActiveFilter(category) {
            currentFilter = category;
            
            // Update active filter tag
            document.querySelectorAll('.filter-tag').forEach(tag => {
                tag.classList.remove('active');
            });
            document.querySelector(`[data-category="${category}"]`).classList.add('active');
            
            renderLinks();
            updateStats();
        }

        function openLink(url) {
            window.open(url, '_blank');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'k') {
                e.preventDefault();
                document.getElementById('search-input').focus();
            }
        });
