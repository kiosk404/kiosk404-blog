<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiosk's Studio</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="./_static/css/vue.css">
  <link rel="stylesheet" href="./_themes/prism/prism-gruvbox-dark.css">
</head>
<body>
  <div id="app">Loading ...</div>
  <script>                     // 配置项：https://docsify.js.org/#/zh-cn/configuration
    window.$docsify = {
      name: '<img src="/_media/k8s.svg"><p>深入 kubertnets</p>',
      repo: '',
      loadSidebar: true,    // 加载 _sidebar.md
      loadNavbar: true,     // 加载 _navbar.md
      hideSidebar: false,
      subMaxLevel: 3,
      // basePath: 'https://docsify.js.org/',
      // logo: '/_media/k8s.svg',
      themeColor: '#3F51B5',
      autoHeader: false,      // Navbar 自动添加 Header
      mergeNavbar: true,      // 小屏设备下合并导航栏到侧边栏。
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      onlyCover: true,
      topMargin: 90,
      count:{
        countable:true,
        fontsize:'0.9em',
        color:'rgb(90,90,90)',
        language:'chinese'
      },
      tabs: {                    // https://jhildenbiddle.github.io/docsify-tabs/#/
        persist    : true,       // default
        sync       : true,       // default
        theme      : 'material', // default
        tabComments: true,       // default
        tabHeadings: true        // default
      },
      copyCode: {               // 代码块点击复制
        buttonText : 'Copy',
        errorText  : 'Error',
        successText: 'Copied'
      },
      themeable: {
          readyTransition : true, // default
          responsiveTables: true  // default
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script type="text/javascript" src="./_static/js/docsify.js"></script>
  <script type="text/javascript" src="./_static/js/search.min.js"></script>
  <script type="text/javascript" src="./_static/js/emoji.min.js"></script>
  <script type="text/javascript" src="./_static/js/zoom-image.min.js"></script>
  <script type="text/javascript" src="./_static/js/docsify-copy-code.min.js"></script>
  <script type="text/javascript" src="./_static/js/countable.js"></script>
  <!-- <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script> -->
  <script type="text/javascript" src="./_static/js/docsify-tabs.js"></script>
  <script type="text/javascript" src="./_static/js/prism-go.min.js"></script>
  <script type="text/javascript" src="./_static/js/prism-bash.min.js"></script>
  <script type="text/javascript" src="./_static/js/prism-markdown.min.js"></script>
  <script type="text/javascript" src="./_static/js/prism-nginx.min.js"></script>
</body>
</html>
